<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중서부 한미노회 위원회 조직 관리 폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-xl p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">중서부 한미노회 위원회 조직 관리 시스템</h1>

        <!-- 상단 임원회, 대회/총회 총대 영역 -->
        <div class="mb-8 bg-blue-50 p-6 rounded-lg border border-blue-100">
            <h2 class="text-lg font-semibold text-blue-900 mb-4">📌 임원회 및 총대진 (직책: 성명 형식)</h2>
            <div id="executives-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 자바스크립트로 동적 생성됨 -->
            </div>
            <button onclick="addExecutiveField()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 transition">+ 항목 추가</button>
        </div>

        <!-- 위원회 조직표 영역 -->
        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-gray-800">📋 위원회별 연도별 명단 조직표</h2>
            <div class="space-x-2">
                <button onclick="saveData()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 transition">저장하기</button>
                <button onclick="resetData()" class="bg-gray-500 text-white px-4 py-2 rounded text-sm hover:bg-gray-600 transition">기본값 복원</button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-300 text-sm">
                <thead>
                    <tr class="bg-gray-100 text-gray-700">
                        <th class="border border-gray-300 p-3 w-1/5">위원회 명칭</th>
                        <th class="border border-gray-300 p-3 w-1/4">2026년조 (1년)</th>
                        <th class="border border-gray-300 p-3 w-1/4">2027년조 (2년)</th>
                        <th class="border border-gray-300 p-3 w-1/4">2028년조 (3년) / 기타</th>
                    </tr>
                </thead>
                <tbody id="committee-table-body">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 초기 데이터 (첨부파일 기반)
        const initialData = {
            executives: [
                { title: "노회장", name: "황종언 목사" },
                { title: "부노회장", name: "하정헌 장로" },
                { title: "사무총장", name: "최병훈 목사" },
                { title: "정서기", name: "이성은 목사" },
                { title: "재무", name: "이윤종 장로" },
                { title: "회록서기", name: "박희준 장로" },
                { title: "대회총대", name: "이성은 목사(26), 임인근 장로(27), 김대환 목사(28)" },
                { title: "총회총대", name: "김응두 장로, 정지훈 목사(2026-2027)" }
            ],
            committees: [
                {
                    name: "공천",
                    col1: "유원하 목사(한사랑복음)\n김용두 장로(미드웨스트)\n문진규 장로(연합)\n박규완 목사(레익뷰)\n류한국 목사(베다니)\n임채석 장로(언약)",
                    col2: "류승열 장로(한미)\n김대환 목사(연합)\n박인천 목사(한마음)",
                    col3: ""
                },
                {
                    name: "교육 및 목사후보생 (CPM)",
                    col1: "전상현 목사(미드웨스트)\nLuke Shin 목사(기도의 집)\n김승규 장로(연합)***\n김영문 목사(새닐)\n이선비 장로(한사랑복음)\n표경진 장로(두나미스)",
                    col2: "이강산 목사(로렌스)\n황광연 장로(언약)\n하승민 목사(한사랑복음)",
                    col3: ""
                },
                {
                    name: "목회 (COM)",
                    col1: "권효섭 장로(언약)\n김우창 목사(새계명)\n김지석 목사(충만)\n유재오 장로(레익뷰)\n정철환 장로(새날)\n변해성 목사(올네이션스)",
                    col2: "이태명 장로(필복)\n조은성 목사(연합)\n최정수 목사(한미)",
                    col3: ""
                },
                {
                    name: "법인 이사회",
                    col1: "권성준 장로(한미)\n민병선 장로(레익뷰)\n박인혁 목사(은퇴)\n김영재 장로(새날)\n강상원 장로(한사랑복음)\n이호영 장로(미드웨스트)\nRich Kim 목사(두나미스)\n정지훈 목사(필복)\n박정호 목사(하나*)",
                    col2: "채복기 목사(은퇴)\n이순옥 목사(준회원)",
                    col3: "이만석 목사(은퇴)\n김광수 목사(기도의 집)\n고훈 목사(한미)\n\n[김우종 장로 외]\n김우종 장로(한미)\n정형식 장로(새날)\n류정선 장로(한마음)"
                },
                {
                    name: "선교 및 교회 발전",
                    col1: "이민구 장로(미드웨스트)\n이신민 목사(언약)\n정환곤 장로(블루/노밀)",
                    col2: "허광영 장로(두나미스)\n오상환 장로(베다니)\n이덕진 장로(연합)",
                    col3: "Sean Kim 목사(기도의 집)\n곽영탁 장로(베다니)\n김윤민 목사(언약)\n곽철 목사(은퇴)\n노재왕 목사(VM)\n윤자명 장로(언약)"
                },
                {
                    name: "대표 및 정책 기록",
                    col1: "이선호 장로(연합)\n박중현 목사(한미)**\n서형태 장로(두나미스)\n유한성 목사(락포드)\n전윤수 장로(연합)\n조진호 장로(블루/노말)\n이근용 장로(한사랑복음)\n김혜순 장로(한미)\n임인근 장로(두나미스)",
                    col2: "임채석 장로(언약, 26)\n이만석 목사(은퇴,27)\n김응두 장로(미드웨스트, 27)\n박인혁 목사(은퇴,28)",
                    col3: ""
                },
                {
                    name: "상임 사법 전권",
                    col1: "함은경 장로(한미, 28)\n김지석 목사(충만, 29)\n김우년 장로(연합,29)\n박규완 목사(레익뷰,30)\n전상현 목사(미드웨스트,30)\n임문상 장로(베다니,30)\n유원하 목사(은퇴,31)\n곽철 목사(은퇴,32)",
                    col2: "",
                    col3: ""
                },
                {
                    name: "준회원(MAL)",
                    col1: "천서희 목사\n노은철 목사(늘푸른)\n김성환 목사\n이봉헌 목사",
                    col2: "",
                    col3: ""
                },
                {
                    name: "총회, 해외",
                    col1: "송진우(한국)\n원상영(육군군목)\n이철원 목사(은퇴이주)\n신현정(은퇴)\n송금섭(은퇴선교)\n유승원(은퇴한국)\n이종형(은퇴이주)\n고광문 목사(VM)\n김삼영 목사(총회)",
                    col2: "",
                    col3: ""
                }
            ]
        };

        function loadData() {
            const saved = localStorage.getItem('nohe_data');
            return saved ? JSON.parse(saved) : initialData;
        }

        function renderForm() {
            const data = loadData();

            // 1. 임원진 렌더링
            const execContainer = document.getElementById('executives-container');
            execContainer.innerHTML = '';
            data.executives.forEach((exec, index) => {
                execContainer.innerHTML += `
                    <div class="flex items-center space-x-2 bg-white p-3 rounded border border-gray-200 shadow-sm">
                        <input type="text" value="${exec.title}" placeholder="직책 (예: 노회장)" class="exec-title border p-1.5 rounded w-1/3 text-sm font-medium bg-gray-50" onchange="updateExecutive(${index})">
                        <span class="text-gray-500">:</span>
                        <input type="text" value="${exec.name}" placeholder="이름 및 소속" class="exec-name border p-1.5 rounded w-full text-sm" onchange="updateExecutive(${index})">
                        <button onclick="removeExecutive(${index})" class="text-red-500 hover:text-red-700 px-2 font-bold">×</button>
                    </div>
                `;
            });

            // 2. 위원회 조직표 렌더링
            const tableBody = document.getElementById('committee-table-body');
            tableBody.innerHTML = '';
            data.committees.forEach((comm, index) => {
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="border border-gray-300 p-3 font-semibold bg-gray-50 text-gray-700 align-top">
                            ${comm.name}
                        </td>
                        <td class="border border-gray-300 p-2 align-top">
                            <textarea rows="4" class="w-full border p-2 rounded text-xs comm-input" data-index="${index}" data-col="col1">${comm.col1}</textarea>
                        </td>
                        <td class="border border-gray-300 p-2 align-top">
                            <textarea rows="4" class="w-full border p-2 rounded text-xs comm-input" data-index="${index}" data-col="col2">${comm.col2}</textarea>
                        </td>
                        <td class="border border-gray-300 p-2 align-top">
                            <textarea rows="4" class="w-full border p-2 rounded text-xs comm-input" data-index="${index}" data-col="col3">${comm.col3}</textarea>
                        </td>
                    </tr>
                `;
            });
        }

        function updateExecutive(index) {
            const data = loadData();
            const container = document.getElementById('executives-container');
            const rows = container.children;
            data.executives[index].title = rows[index].querySelector('.exec-title').value;
            data.executives[index].name = rows[index].querySelector('.exec-name').value;
            localStorage.setItem('nohe_data', JSON.stringify(data));
        }

        function addExecutiveField() {
            const data = loadData();
            data.executives.push({ title: "직책", name: "이름" });
            localStorage.setItem('nohe_data', JSON.stringify(data));
            renderForm();
        }

        function removeExecutive(index) {
            const data = loadData();
            data.executives.splice(index, 1);
            localStorage.setItem('nohe_data', JSON.stringify(data));
            renderForm();
        }

        function saveData() {
            const data = loadData();
            // 텍스트에어리어 값들 수집
            document.querySelectorAll('.comm-input').forEach(textarea => {
                const index = textarea.getAttribute('data-index');
                const col = textarea.getAttribute('data-col');
                data.committees[index][col] = textarea.value;
            });
            localStorage.setItem('nohe_data', JSON.stringify(data));
            alert('성공적으로 저장되었습니다! 브라우저를 닫아도 내용이 유지됩니다.');
        }

        function resetData() {
            if (confirm('모든 내용을 초기 기본값으로 되돌리시겠습니까?')) {
                localStorage.removeItem('nohe_data');
                renderForm();
                alert('초기화되었습니다.');
            }
        }

        // 페이지 로드시 렌더링
        window.onload = renderForm;
    </script>
</body>
</html>
