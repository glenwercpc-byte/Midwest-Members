<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중서부 한미노회 위원회 조직 관리 폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .auto-resize {
            overflow: hidden;
            resize: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-6">
    <div class="max-w-[95%] mx-auto bg-white shadow-lg rounded-xl p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">중서부 한미노회 위원회 조직 관리 시스템</h1>

        <!-- 상단 임원회 및 총대진 영역 -->
        <div class="mb-8 bg-blue-50 p-5 rounded-lg border border-blue-100">
            <h2 class="text-base font-semibold text-blue-900 mb-3">📌 임원회 및 총대진</h2>
            
            <!-- 임원진 한 라인 가로 나열 -->
            <div class="mb-4">
                <span class="text-xs font-bold text-gray-600 block mb-1">■ 임원회 (고정)</span>
                <div id="executives-line-1" class="flex flex-wrap gap-2">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </div>
            </div>

            <!-- 대회총대, 총회총대 배치 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-3 border-t border-blue-200" id="executives-line-2">
                <!-- 자바스크립트로 동적 생성됨 -->
            </div>
        </div>

        <!-- 위원회 조직표 영역 상단 버튼 -->
        <div class="mb-4 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-gray-800">📋 위원회별 조직표 관리</h2>
            <div class="space-x-2">
                <button onclick="saveData()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 transition">저장하기</button>
                <button onclick="resetData()" class="bg-gray-500 text-white px-4 py-2 rounded text-sm hover:bg-gray-600 transition">기본값 복원</button>
            </div>
        </div>

        <!-- 위원회 조직표 테이블 -->
        <div class="w-full overflow-x-hidden">
            <table class="w-full border-collapse border border-gray-300 text-sm">
                <thead>
                    <tr class="bg-gray-100 text-gray-700">
                        <th class="border border-gray-300 p-2 w-[14%] text-center">위원회 명칭</th>
                        <th class="border border-gray-300 p-2 w-[29%] text-center">
                            <input type="text" id="col-title-1" class="w-full text-center font-semibold bg-transparent border-b border-gray-400 focus:outline-none" value="2026년조 (1년)">
                        </th>
                        <th class="border border-gray-300 p-2 w-[29%] text-center">
                            <input type="text" id="col-title-2" class="w-full text-center font-semibold bg-transparent border-b border-gray-400 focus:outline-none" value="2027년조 (2년)">
                        </th>
                        <th class="border border-gray-300 p-2 w-[28%] text-center">
                            <input type="text" id="col-title-3" class="w-full text-center font-semibold bg-transparent border-b border-gray-400 focus:outline-none" value="2028년조 (3년) / 기타">
                        </th>
                    </tr>
                </thead>
                <tbody id="committee-table-body">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const initialData = {
            columnTitles: {
                col1: "2026년조 (1년)",
                col2: "2027년조 (2년)",
                col3: "2028년조 (3년) / 기타"
            },
            executives: [
                { title: "노회장", name: "황종언 목사" },
                { title: "부노회장", name: "하정헌 장로" },
                { title: "사무총장", name: "최병훈 목사" },
                { title: "정서기", name: "이성은 목사" },
                { title: "재무", name: "이윤종 장로" },
                { title: "회록서기", name: "박희준 장로" },
                { title: "대회총대", name: "이성은 목사(26), 임인근 장로(27), 김대환 목사(28)" },
                { title: "총회총대", name: "김응두 장로, 정지훈 목사(2026-2027)" }
            ],
            committees: [
                {
                    name: "공천",
                    col1_left: "유원하 목사(한사랑복음)\n문진규 장로(연합)\n류한국 목사(베다니)",
                    col1_right: "김용두 장로(미드웨스트)\n박규완 목사(레익뷰)\n임채석 장로(언약)",
                    col2_left: "류승열 장로(한미)\n박인천 목사(한마음)",
                    col2_right: "김대환 목사(연합)",
                    col3_left: "", col3_right: ""
                },
                {
                    name: "교육 및 목사후보생 (CPM)",
                    col1_left: "전상현 목사(미드웨스트)\n김승규 장로(연합)***\n이선비 장로(한사랑복음)",
                    col1_right: "Luke Shin 목사(기도의 집)\n김영문 목사(새닐)\n표경진 장로(두나미스)",
                    col2_left: "이강산 목사(로렌스)\n하승민 목사(한사랑복음)",
                    col2_right: "황광연 장로(언약)",
                    col3_left: "", col3_right: ""
                },
                {
                    name: "목회 (COM)",
                    col1_left: "권효섭 장로(언약)\n김지석 목사(충만)\n정철환 장로(새날)",
                    col1_right: "김우창 목사(새계명)\n유재오 장로(레익뷰)\n변해성 목사(올네이션스)",
                    col2_left: "이태명 장로(필복)\n최정수 목사(한미)",
                    col2_right: "조은성 목사(연합)",
                    col3_left: "", col3_right: ""
                },
                {
                    name: "법인 이사회",
                    col1_left: "권성준 장로(한미)\n박인혁 목사(은퇴)\n강상원 장로(한사랑복음)\nRich Kim 목사(두나미스)\n박정호 목사(하나*)",
                    col1_right: "민병선 장로(레익뷰)\n김영재 장로(새날)\n이호영 장로(미드웨스트)\n정지훈 목사(필복)",
                    col2_left: "채복기 목사(은퇴)",
                    col2_right: "이순옥 목사(준회원)",
                    col3_left: "이만석 목사(은퇴)\n고훈 목사(한미)\n김우종 장로(한미)\n류정선 장로(한마음)",
                    col3_right: "김광수 목사(기도의 집)\n정형식 장로(새날)"
                },
                {
                    name: "선교 및 교회 발전",
                    col1_left: "이민구 장로(미드웨스트)\n정환곤 장로(블루/노밀)",
                    col1_right: "이신민 목사(언약)",
                    col2_left: "허광영 장로(두나미스)\n이덕진 장로(연합)",
                    col2_right: "오상환 장로(베다니)",
                    col3_left: "Sean Kim 목사(기도의 집)\n김윤민 목사(언약)\n노재왕 목사(VM)",
                    col3_right: "곽영탁 장로(베다니)\n곽철 목사(은퇴)\n윤자명 장로(언약)"
                },
                {
                    name: "대표 및 정책 기록",
                    col1_left: "이선호 장로(연합)\n서형태 장로(두나미스)\n전윤수 장로(연합)\n이근용 장로(한사랑복음)\n임인근 장로(두나미스)",
                    col1_right: "박중현 목사(한미)**\n유한성 목사(락포드)\n조진호 장로(블루/노말)\n김혜순 장로(한미)",
                    col2_left: "임채석 장로(언약, 26)\n김응두 장로(미드웨스트, 27)",
                    col2_right: "이만석 목사(은퇴,27)\n박인혁 목사(은퇴,28)",
                    col3_left: "", col3_right: ""
                },
                {
                    name: "상임 사법 전권",
                    col1_left: "함은경 장로(한미, 28)\n김우년 장로(연합,29)\n전상현 목사(미드웨스트,30)\n유원하 목사(은퇴,31)",
                    col1_right: "김지석 목사(충만, 29)\n박규완 목사(레익뷰,30)\n임문상 장로(베다니,30)\n곽철 목사(은퇴,32)",
                    col2_left: "", col2_right: "", col3_left: "", col3_right: ""
                },
                {
                    name: "준회원(MAL)",
                    col1_left: "천서희 목사\n김성환 목사",
                    col1_right: "노은철 목사(늘푸른)\n이봉헌 목사",
                    col2_left: "", col2_right: "", col3_left: "", col3_right: ""
                },
                {
                    name: "총회, 해외",
                    col1_left: "송진우(한국)\n이철원 목사(은퇴이주)\n송금섭(은퇴선교)\n이종형(은퇴이주)\n김삼영 목사(총회)",
                    col1_right: "원상영(육군군목)\n신현정(은퇴)\n유승원(은퇴한국)\n고광문 목사(VM)",
                    col2_left: "", col2_right: "", col3_left: "", col3_right: ""
                }
            ]
        };

        function loadData() {
            const saved = localStorage.getItem('nohe_data_v3');
            return saved ? JSON.parse(saved) : initialData;
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight + 4) + 'px';
        }

        function renderForm() {
            const data = loadData();

            if(data.columnTitles) {
                document.getElementById('col-title-1').value = data.columnTitles.col1 || "2026년조 (1년)";
                document.getElementById('col-title-2').value = data.columnTitles.col2 || "2027년조 (2년)";
                document.getElementById('col-title-3').value = data.columnTitles.col3 || "2028년조 (3년) / 기타";
            }

            // 1. 임원진 가로 한 줄 나열
            const line1Container = document.getElementById('executives-line-1');
            line1Container.innerHTML = '';
            data.executives.slice(0, 6).forEach((exec, index) => {
                line1Container.innerHTML += `
                    <div class="bg-white px-3 py-1.5 rounded border border-blue-200 shadow-sm flex items-center space-x-1.5 flex-grow">
                        <span class="text-xs font-bold text-blue-800 shrink-0">${exec.title}:</span>
                        <input type="text" value="${exec.name}" class="exec-name border-b border-transparent hover:border-gray-300 focus:border-blue-500 p-0.5 rounded text-xs w-full bg-transparent focus:bg-white" data-index="${index}" onchange="updateExecutive(${index})">
                    </div>
                `;
            });

            // 2. 총대진
            const line2Container = document.getElementById('executives-line-2');
            line2Container.innerHTML = '';
            data.executives.slice(6, 8).forEach((exec, idx) => {
                const index = idx + 6;
                line2Container.innerHTML += `
                    <div class="bg-white p-2.5 rounded border border-blue-200 shadow-sm flex items-center space-x-2">
                        <span class="text-xs font-bold text-blue-800 w-20 shrink-0">${exec.title}:</span>
                        <input type="text" value="${exec.name}" class="exec-name border-b border-transparent hover:border-gray-300 focus:border-blue-500 p-1 rounded text-xs w-full bg-transparent focus:bg-white" data-index="${index}" onchange="updateExecutive(${index})">
                    </div>
                `;
            });

            // 3. 위원회 조직표 (각 조별 칸을 좌우 2개의 박스로 분할하여 2열 배치)
            const tableBody = document.getElementById('committee-table-body');
            tableBody.innerHTML = '';
            data.committees.forEach((comm, index) => {
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="border border-gray-300 p-2 font-semibold bg-gray-50 text-gray-700 text-center align-middle text-xs md:text-sm">
                            ${comm.name}
                        </td>
                        <!-- 1열 (예: 2026년조) 좌우 분할 -->
                        <td class="border border-gray-300 p-1 align-top">
                            <div class="grid grid-cols-2 gap-1">
                                <textarea class="w-full border p-1 rounded text-xs comm-input auto-resize" data-index="${index}" data-col="col1_left" oninput="autoResizeTextarea(this)">${comm.col1_left || ''}</textarea>
                                <textarea class="w-full border p-1 rounded text-xs comm-input auto-resize" data-index="${index}" data-col="col1_right" oninput="autoResizeTextarea(this)">${comm.col1_right || ''}</textarea>
                            </div>
                        </td>
                        <!-- 2열 (예: 2027년조) 좌우 분할 -->
                        <td class="border border-gray-300 p-1 align-top">
                            <div class="grid grid-cols-2 gap-1">
                                <textarea class="w-full border p-1 rounded text-xs comm-input auto-resize" data-index="${index}" data-col="col2_left" oninput="autoResizeTextarea(this)">${comm.col2_left || ''}</textarea>
                                <textarea class="w-full border p-1 rounded text-xs comm-input auto-resize" data-index="${index}" data-col="col2_right" oninput="autoResizeTextarea(this)">${comm.col2_right || ''}</textarea>
                            </div>
                        </td>
                        <!-- 3열 (예: 2028년조) 좌우 분할 -->
                        <td class="border border-gray-300 p-1 align-top">
                            <div class="grid grid-cols-2 gap-1">
                                <textarea class="w-full border p-1 rounded text-xs comm-input auto-resize" data-index="${index}" data-col="col3_left" oninput="autoResizeTextarea(this)">${comm.col3_left || ''}</textarea>
                                <textarea class="w-full border p-1 rounded text-xs comm-input auto-resize" data-index="${index}" data-col="col3_right" oninput="autoResizeTextarea(this)">${comm.col3_right || ''}</textarea>
                            </div>
                        </td>
                    </tr>
                `;
            });

            setTimeout(() => {
                document.querySelectorAll('.auto-resize').forEach(textarea => {
                    autoResizeTextarea(textarea);
                });
            }, 50);
        }

        function updateExecutive(index) {
            const data = loadData();
            const input = document.querySelector(`.exec-name[data-index="${index}"]`);
            if (input) {
                data.executives[index].name = input.value;
                localStorage.setItem('nohe_data_v3', JSON.stringify(data));
            }
        }

        function saveData() {
            const data = loadData();
            
            data.columnTitles = {
                col1: document.getElementById('col-title-1').value,
                col2: document.getElementById('col-title-2').value,
                col3: document.getElementById('col-title-3').value
            };

            document.querySelectorAll('.exec-name').forEach(input => {
                const index = input.getAttribute('data-index');
                data.executives[index].name = input.value;
            });

            document.querySelectorAll('.comm-input').forEach(textarea => {
                const index = textarea.getAttribute('data-index');
                const col = textarea.getAttribute('data-col');
                data.committees[index][col] = textarea.value;
            });

            localStorage.setItem('nohe_data_v3', JSON.stringify(data));
            alert('성공적으로 저장되었습니다! 브라우저를 닫아도 내용이 유지됩니다.');
        }

        function resetData() {
            if (confirm('모든 내용을 초기 기본값으로 되돌리시겠습니까?')) {
                localStorage.removeItem('nohe_data_v3');
                renderForm();
                alert('초기화되었습니다.');
            }
        }

        window.onload = renderForm;
    </script>
</body>
</html>
