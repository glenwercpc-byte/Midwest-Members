<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중서부 한미노회 위원회 조직 관리 폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .auto-resize {
            overflow: hidden;
            resize: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-6">
    <!-- 전체 화면 너비를 적당한 크기(max-w-6xl)로 고정 -->
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-xl p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">중서부 한미노회 위원회 조직 관리 시스템</h1>

        <!-- 상단 임원회 및 총대진 영역 -->
        <div class="mb-8 bg-blue-50 p-5 rounded-lg border border-blue-100">
            <h2 class="text-base font-semibold text-blue-900 mb-3">📌 임원회 및 총대진</h2>
            
            <!-- 임원진 6명 한 줄 고정 -->
            <div class="mb-3">
                <span class="text-xs font-bold text-gray-600 block mb-1">■ 임원회 (고정)</span>
                <div id="executives-line-1" class="flex flex-row gap-2 overflow-x-auto pb-1"></div>
            </div>

            <!-- 대회총대, 총회총대 배치 (폭을 노회장과 같이 슬림하게 축소) -->
            <div>
                <span class="text-xs font-bold text-gray-600 block mb-1">■ 총대진</span>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="executives-line-2"></div>
            </div>
        </div>

        <!-- 위원회 조직표 영역 상단 버튼 -->
        <div class="mb-4 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-gray-800">📋 위원회별 조직표 관리</h2>
            <div class="space-x-2">
                <button onclick="saveData()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 transition">저장하기</button>
                <button onclick="resetData()" class="bg-gray-500 text-white px-4 py-2 rounded text-sm hover:bg-gray-600 transition">기본값 복원</button>
            </div>
        </div>

        <!-- 위원회 조직표 테이블 -->
        <div class="w-full overflow-x-auto">
            <table class="w-full border-collapse border border-gray-300 text-sm">
                <thead>
                    <tr class="bg-gray-100 text-gray-700">
                        <th class="border border-gray-300 p-2 w-[16%] text-center">위원회 명칭</th>
                        <th class="border border-gray-300 p-2 w-[28%] text-center">
                            <input type="text" id="col-title-1" class="w-full text-center font-semibold bg-transparent border-b border-gray-400 focus:outline-none" value="2026년조 (1년)">
                        </th>
                        <th class="border border-gray-300 p-2 w-[28%] text-center">
                            <input type="text" id="col-title-2" class="w-full text-center font-semibold bg-transparent border-b border-gray-400 focus:outline-none" value="2027년조 (2년)">
                        </th>
                        <th class="border border-gray-300 p-2 w-[28%] text-center">
                            <input type="text" id="col-title-3" class="w-full text-center font-semibold bg-transparent border-b border-gray-400 focus:outline-none" value="2028년조 (3년) / 기타">
                        </th>
                    </tr>
                </thead>
                <tbody id="committee-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const initialData = {
            columnTitles: {
                col1: "2026년조 (1년)",
                col2: "2027년조 (2년)",
                col3: "2028년조 (3년) / 기타"
            },
            executives: [
                { title: "노회장", name: "황종언 목사" },
                { title: "부노회장", name: "하정헌 장로" },
                { title: "사무총장", name: "최병훈 목사" },
                { title: "정서기", name: "이성은 목사" },
                { title: "재무", name: "이윤종 장로" },
                { title: "회록서기", name: "박희준 장로" },
                { title: "대회총대", name: "이성은 목사(26), 임인근 장로(27), 김대환 목사(28)" },
                { title: "총회총대", name: "김응두 장로, 정지훈 목사(2026-2027)" }
            ],
            committees: [
                {
                    name: "공천",
                    col1_left: ["유원하 목사(한사랑복음)", "문진규 장로(연합)", "류한국 목사(베다니)"],
                    col1_right: ["김용두 장로(미드웨스트)", "박규완 목사(레익뷰)", "임채석 장로(언약)"],
                    col2_left: ["류승열 장로(한미)", "박인천 목사(한마음)"],
                    col2_right: ["김대환 목사(연합)"],
                    col3_left: [], col3_right: []
                },
                {
                    name: "교육 및 목사후보생 (CPM)",
                    col1_left: ["전상현 목사(미드웨스트)", "김승규 장로(연합)***", "이선비 장로(한사랑복음)"],
                    col1_right: ["Luke Shin 목사(기도의 집)", "김영문 목사(새닐)", "표경진 장로(두나미스)"],
                    col2_left: ["이강산 목사(로렌스)", "하승민 목사(한사랑복음)"],
                    col2_right: ["황광연 장로(언약)"],
                    col3_left: [], col3_right: []
                },
                {
                    name: "목회 (COM)",
                    col1_left: ["권효섭 장로(언약)", "김지석 목사(충만)", "정철환 장로(새날)"],
                    col1_right: ["김우창 목사(새계명)", "유재오 장로(레익뷰)", "변해성 목사(올네이션스)"],
                    col2_left: ["이태명 장로(필복)", "최정수 목사(한미)"],
                    col2_right: ["조은성 목사(연합)"],
                    col3_left: [], col3_right: []
                },
                {
                    name: "법인 이사회",
                    col1_left: ["권성준 장로(한미)", "박인혁 목사(은퇴)", "강상원 장로(한사랑복음)", "Rich Kim 목사(두나미스)", "박정호 목사(하나*)"],
                    col1_right: ["민병선 장로(레익뷰)", "김영재 장로(새날)", "이호영 장로(미드웨스트)", "정지훈 목사(필복)"],
                    col2_left: ["채복기 목사(은퇴)"],
                    col2_right: ["이순옥 목사(준회원)"],
                    col3_left: ["이만석 목사(은퇴)", "고훈 목사(한미)", "김우종 장로(한미)", "류정선 장로(한마음)"],
                    col3_right: ["김광수 목사(기도의 집)", "정형식 장로(새날)"]
                },
                {
                    name: "선교 및 교회 발전",
                    col1_left: ["이민구 장로(미드웨스트)", "정환곤 장로(블루/노밀)"],
                    col1_right: ["이신민 목사(언약)"],
                    col2_left: ["허광영 장로(두나미스)", "이덕진 장로(연합)"],
                    col2_right: ["오상환 장로(베다니)"],
                    col3_left: ["Sean Kim 목사(기도의 집)", "김윤민 목사(언약)", "노재왕 목사(VM)"],
                    col3_right: ["곽영탁 장로(베다니)", "곽철 목사(은퇴)", "윤자명 장로(언약)"]
                },
                {
                    name: "대표 및 정책 기록",
                    col1_left: ["이선호 장로(연합)", "서형태 장로(두나미스)", "전윤수 장로(연합)", "이근용 장로(한사랑복음)", "임인근 장로(두나미스)"],
                    col1_right: ["박중현 목사(한미)**", "유한성 목사(락포드)", "조진호 장로(블루/노말)", "김혜순 장로(한미)"],
                    col2_left: ["임채석 장로(언약, 26)", "김응두 장로(미드웨스트, 27)"],
                    col2_right: ["이만석 목사(은퇴,27)", "박인혁 목사(은퇴,28)"],
                    col3_left: [], col3_right: []
                },
                {
                    name: "상임 사법 전권",
                    col1_left: ["함은경 장로(한미, 28)", "김우년 장로(연합,29)", "전상현 목사(미드웨스트,30)", "유원하 목사(은퇴,31)"],
                    col1_right: ["김지석 목사(충만, 29)", "박규완 목사(레익뷰,30)", "임문상 장로(베다니,30)", "곽철 목사(은퇴,32)"],
                    col2_left: [], col2_right: [], col3_left: [], col3_right: []
                },
                {
                    name: "준회원(MAL)",
                    col1_left: ["천서희 목사", "김성환 목사"],
                    col1_right: ["노은철 목사(늘푸른)", "이봉헌 목사"],
                    col2_left: [], col2_right: [], col3_left: [], col3_right: []
                },
                {
                    name: "총회, 해외",
                    col1_left: ["송진우(한국)", "이철원 목사(은퇴이주)", "송금섭(은퇴선교)", "이종형(은퇴이주)", "김삼영 목사(총회)"],
                    col1_right: ["원상영(육군군목)", "신현정(은퇴)", "유승원(은퇴한국)", "고광문 목사(VM)"],
                    col2_left: [], col2_right: [], col3_left: [], col3_right: []
                }
            ]
        };

        function loadData() {
            const saved = localStorage.getItem('nohe_data_v12');
            return saved ? JSON.parse(saved) : initialData;
        }

        function renderForm() {
            const data = loadData();

            if(data.columnTitles) {
                document.getElementById('col-title-1').value = data.columnTitles.col1 || "2026년조 (1년)";
                document.getElementById('col-title-2').value = data.columnTitles.col2 || "2027년조 (2년)";
                document.getElementById('col-title-3').value = data.columnTitles.col3 || "2028년조 (3년) / 기타";
            }

            const line1Container = document.getElementById('executives-line-1');
            line1Container.innerHTML = '';
            data.executives.slice(0, 6).forEach((exec, index) => {
                line1Container.innerHTML += `
                    <div class="bg-white px-2 py-1.5 rounded border border-blue-200 shadow-sm flex items-center space-x-1 shrink-0 min-w-[145px] flex-1">
                        <span class="text-[11px] font-bold text-blue-800 shrink-0">${exec.title}:</span>
                        <input type="text" value="${exec.name}" class="exec-name border-b border-transparent hover:border-gray-300 focus:border-blue-500 p-0.5 rounded text-xs w-full bg-transparent focus:bg-white" data-index="${index}">
                    </div>
                `;
            });

            const line2Container = document.getElementById('executives-line-2');
            line2Container.innerHTML = '';
            data.executives.slice(6, 8).forEach((exec, idx) => {
                const index = idx + 6;
                line2Container.innerHTML += `
                    <div class="bg-white px-2 py-1.5 rounded border border-blue-200 shadow-sm flex items-center space-x-1">
                        <span class="text-[11px] font-bold text-blue-800 w-16 shrink-0">${exec.title}:</span>
                        <input type="text" value="${exec.name}" class="exec-name border-b border-transparent hover:border-gray-300 focus:border-blue-500 p-0.5 rounded text-xs w-full bg-transparent focus:bg-white" data-index="${index}">
                    </div>
                `;
            });

            const tableBody = document.getElementById('committee-table-body');
            tableBody.innerHTML = '';
            
            data.committees.forEach((comm, cIndex) => {
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="border border-gray-300 p-2 font-semibold bg-gray-50 text-gray-700 text-center align-middle text-xs md:text-sm">
                            ${comm.name}
                        </td>
                        <td class="border border-gray-300 p-1.5 align-top">
                            <div class="grid grid-cols-2 gap-1.5">
                                <div class="space-y-1 container-left" id="box-${cIndex}-col1_left">
                                    ${renderPersonInputs(comm.col1_left, cIndex, 'col1_left')}
                                </div>
                                <div class="space-y-1 container-right" id="box-${cIndex}-col1_right">
                                    ${renderPersonInputs(comm.col1_right, cIndex, 'col1_right')}
                                </div>
                            </div>
                        </td>
                        <td class="border border-gray-300 p-1.5 align-top">
                            <div class="grid grid-cols-2 gap-1.5">
                                <div class="space-y-1 container-left" id="box-${cIndex}-col2_left">
                                    ${renderPersonInputs(comm.col2_left, cIndex, 'col2_left')}
                                </div>
                                <div class="space-y-1 container-right" id="box-${cIndex}-col2_right">
                                    ${renderPersonInputs(comm.col2_right, cIndex, 'col2_right')}
                                </div>
                            </div>
                        </td>
                        <td class="border border-gray-300 p-1.5 align-top">
                            <div class="grid grid-cols-2 gap-1.5">
                                <div class="space-y-1 container-left" id="box-${cIndex}-col3_left">
                                    ${renderPersonInputs(comm.col3_left, cIndex, 'col3_left')}
                                </div>
                                <div class="space-y-1 container-right" id="box-${cIndex}-col3_right">
                                    ${renderPersonInputs(comm.col3_right, cIndex, 'col3_right')}
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            });

            attachEnterEventListener();
        }

        function renderPersonInputs(personList, cIndex, fieldName) {
            if (!personList || personList.length === 0) {
                return `<div class="flex items-center space-x-1"><input type="text" value="" class="w-full border p-1 rounded text-xs comm-person-input bg-white focus:border-blue-500" data-cindex="${cIndex}" data-field="${fieldName}" placeholder="입력"><button type="button" class="del-row-btn text-gray-400 hover:text-red-500 text-xs px-1 font-bold shrink-0" title="취소">×</button></div>`;
            }
            return personList.map((person) => `
                <div class="flex items-center space-x-1">
                    <input type="text" value="${person}" class="w-full border p-1 rounded text-xs comm-person-input bg-white focus:border-blue-500" data-cindex="${cIndex}" data-field="${fieldName}">
                </div>
            `).join('');
        }

        // 엔터 키 동작 제어
        function attachEnterEventListener() {
            document.querySelectorAll('.comm-person-input').forEach(input => {
                input.addEventListener('input', checkInputContent); // 글자 입력 시 x 표시 제어
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        
                        const td = this.closest('td');
                        const leftContainer = td.querySelector('.container-left');
                        const rightContainer = td.querySelector('.container-right');

                        const leftInputs = Array.from(leftContainer.querySelectorAll('.comm-person-input'));
                        const rightInputs = Array.from(rightContainer.querySelectorAll('.comm-person-input'));

                        const isLeft = leftInputs.includes(this);
                        const currentIndex = isLeft ? leftInputs.indexOf(this) : rightInputs.indexOf(this);

                        if (isLeft) {
                            if (currentIndex < leftInputs.length - 1) {
                                leftInputs[currentIndex + 1].focus();
                            } else {
                                if (rightInputs[currentIndex] && rightInputs[currentIndex].value.trim() === '') {
                                    rightInputs[currentIndex].focus();
                                } else if (!rightInputs[currentIndex]) {
                                    const cIndex = this.getAttribute('data-cindex');
                                    const baseField = this.getAttribute('data-field').replace('_left', '');
                                    const rightField = baseField + '_right';

                                    addNewRow(rightContainer, cIndex, rightField);
                                } else {
                                    const cIndex = this.getAttribute('data-cindex');
                                    const baseField = this.getAttribute('data-field').replace('_left', '');
                                    const leftField = baseField + '_left';

                                    addNewRow(leftContainer, cIndex, leftField);
                                }
                            }
                        } else {
                            if (currentIndex < rightInputs.length - 1) {
                                rightInputs[currentIndex + 1].focus();
                            } else {
                                const cIndex = this.getAttribute('data-cindex');
                                const baseField = this.getAttribute('data-field').replace('_right', '');
                                const leftField = baseField + '_left';

                                addNewRow(leftContainer, cIndex, leftField);
                            }
                        }
                    }
                });
            });
        }

        // 글자가 입력되면 x 표시를 숨기고, 지우면 다시 보여주는 함수
        function checkInputContent() {
            const wrapper = this.closest('div');
            const btn = wrapper.querySelector('.del-row-btn');
            if (btn) {
                if (this.value.trim() !== '') {
                    btn.style.display = 'none'; // 글자가 있으면 x 숨김
                } else {
                    btn.style.display = 'inline-block'; // 비어있으면 x 표시
                }
            }
        }

        function addNewRow(container, cIndex, fieldName) {
            const newDiv = document.createElement('div');
            newDiv.className = 'flex items-center space-x-1 mt-1';
            newDiv.innerHTML = `
                <input type="text" value="" class="w-full border p-1 rounded text-xs comm-person-input bg-white focus:border-blue-500" data-cindex="${cIndex}" data-field="${fieldName}" placeholder="입력">
                <button type="button" class="del-row-btn text-gray-400 hover:text-red-500 text-xs px-1 font-bold shrink-0" title="취소">×</button>
            `;
            
            container.appendChild(newDiv);
            
            const newInput = newDiv.querySelector('input');
            attachSingleInputEvent(newInput);
            
            newDiv.querySelector('.del-row-btn').addEventListener('click', function() {
                newDiv.remove();
            });

            newInput.focus();
        }

        function attachSingleInputEvent(input) {
            input.addEventListener('input', checkInputContent);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const td = this.closest('td');
                    const leftContainer = td.querySelector('.container-left');
                    const rightContainer = td.querySelector('.container-right');

                    const leftInputs = Array.from(leftContainer.querySelectorAll('.comm-person-input'));
                    const rightInputs = Array.from(rightContainer.querySelectorAll('.comm-person-input'));

                    const isLeft = leftInputs.includes(this);
                    const currentIndex = isLeft ? leftInputs.indexOf(this) : rightInputs.indexOf(this);

                    if (isLeft) {
                        if (currentIndex < leftInputs.length - 1) {
                            leftInputs[currentIndex + 1].focus();
                        } else {
                            if (rightInputs[currentIndex] && rightInputs[currentIndex].value.trim() === '') {
                                rightInputs[currentIndex].focus();
                            } else if (!rightInputs[currentIndex]) {
                                const cIndex = this.getAttribute('data-cindex');
                                const baseField = this.getAttribute('data-field').replace('_left', '');
                                const rightField = baseField + '_right';
                                addNewRow(rightContainer, cIndex, rightField);
                            } else {
                                const cIndex = this.getAttribute('data-cindex');
                                const baseField = this.getAttribute('data-field').replace('_left', '');
                                const leftField = baseField + '_left';
                                addNewRow(leftContainer, cIndex, leftField);
                            }
                        }
                    } else {
                        if (currentIndex < rightInputs.length - 1) {
                            rightInputs[currentIndex + 1].focus();
                        } else {
                            const cIndex = this.getAttribute('data-cindex');
                            const baseField = this.getAttribute('data-field').replace('_right', '');
                            const leftField = baseField + '_left';
                            addNewRow(leftContainer, cIndex, leftField);
                        }
                    }
                }
            });
        }

        function saveData() {
            const data = loadData();
            
            data.columnTitles = {
                col1: document.getElementById('col-title-1').value,
                col2: document.getElementById('col-title-2').value,
                col3: document.getElementById('col-title-3').value
            };

            document.querySelectorAll('.exec-name').forEach(input => {
                const index = input.getAttribute('data-index');
                data.executives[index].name = input.value;
            });

            data.committees.forEach((comm, cIndex) => {
                ['col1_left', 'col1_right', 'col2_left', 'col2_right', 'col3_left', 'col3_right'].forEach(field => {
                    const inputs = document.querySelectorAll(`.comm-person-input[data-cindex="${cIndex}"][data-field="${field}"]`);
                    let values = [];
                    inputs.forEach(input => {
                        if(input.value.trim() !== '') {
                            values.push(input.value.trim());
                        }
                    });
                    data.committees[cIndex][field] = values;
                });
            });

            localStorage.setItem('nohe_data_v12', JSON.stringify(data));
            alert('성공적으로 저장되었습니다! 브라우저를 닫아도 내용이 유지됩니다.');
        }

        function resetData() {
            if (confirm('모든 내용을 초기 기본값으로 되돌리시겠습니까?')) {
                localStorage.removeItem('nohe_data_v12');
                renderForm();
                alert('초기화되었습니다.');
            }
        }

        window.onload = renderForm;
    </script>
</body>
</html>
